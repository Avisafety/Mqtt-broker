app = "mqtt-broker-avisafe"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[[services]]
  protocol = "tcp"
  internal_port = 1883
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["tls"]
    port = 8883
    tls_options = { alpn = ["mqtt"] }

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
